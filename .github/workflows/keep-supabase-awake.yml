name: Keep Supabase Awake

on:
  schedule:
    - cron: "0 8 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel API
        run: |
          echo "Appel de l'endpoint /api/ping..."

          # -s: silencieux (pas de barre de progression)
          # -w: affiche le code HTTP à la fin
          # -o: sauvegarde le corps de la réponse dans un fichier
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" https://dvf-api-flame.vercel.app/api/ping)

          echo "Code HTTP reçu : $HTTP_STATUS"
          echo "Corps de la réponse :"
          cat response.json
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Le ping a échoué avec le code HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Ping réussi."
